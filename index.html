/* ---- Smart selection: complete/truncate selection into a valid combo ---- */
const rk=c=>c>>2;
function an(cards){
  const n=cards.length;if(!n||new Set(cards).size!==n)return null;
  const s=[...cards].sort((a,b)=>a-b),r=s.map(rk),high=s[n-1];
  if(r.every(x=>x===r[0])){const t=['single','pair','triple','quad'][n-1];return t?{type:t,len:n,high}:null}
  if(r[n-1]===12)return null;
  if(n>=3&&r.every((x,i)=>i===0||x===r[i-1]+1))return{type:'straight',len:n,high};
  if(n>=6&&n%2===0){let ok=true;for(let i=0;i<n;i+=2){if(r[i]!==r[i+1]||(i>0&&r[i]!==r[i-2]+1))ok=false}if(ok)return{type:'pairseq',len:n/2,high}}
  return null;
}
function combos(a,k){if(k===0)return[[]];if(a.length<k)return[];const[h,...rest]=a;return[...combos(rest,k-1).map(c=>[h,...c]),...combos(rest,k)]}
function candOf(hand){const out=[],by=new Map();for(const c of[...hand].sort((a,b)=>a-b))by.set(rk(c),[...(by.get(rk(c))??[]),c]);
  for(const cs of by.values())for(let k=1;k<=cs.length;k++)out.push(...combos(cs,k));
  for(const need of[1,2]){const rs=[...by.keys()].filter(r=>r<12&&by.get(r).length>=need).sort((a,b)=>a-b);
    for(let i=0;i<rs.length;i++)for(let j=i+2;j<rs.length&&rs[j]-rs[i]===j-i;j++)out.push(rs.slice(i,j+1).flatMap(r=>by.get(r).slice(0,need)))}
  return out}
function smartSel(hand,sel){
  if(sel.length<2)return sel;
  if(an(sel))return sel;
  if(sel.length>=3){ // complete: smallest combo containing every picked card
    let best=null;
    for(const cs of candOf(hand))if(cs.length<=sel.length+5&&sel.every(c=>cs.includes(c))&&an(cs)&&(!best||cs.length<best.length))best=cs;
    if(best)return best;
  }
  if(sel.length>=4){ // trim: biggest valid combo inside the selection
    let sub=null;
    for(const cs of candOf(sel))if(an(cs)&&(!sub||cs.length>sub.length))sub=cs;
    if(sub)return sub;
  }
  return sel;
}

    <div class="st"><b>${profile?.games??0}</b>${t('played')}</div>
    <div class="st"><b>${profile?.wins??0}</b>${t('wins')}</div>
    <div class="st"><b>${wr}%</b>Win rate</div>
    <div class="st"><b>${profile?.best_rank??'—'}</b>${t('rank')}</div>
    <div class="st"><b>🔥${profile?.streak??0}</b>Streak</div>
    <div class="st"><b>${profile?.best_streak??0}</b>Best 🔥</div>
  </div>
  <div><label>${t('avatar')}</label><div class="row" style="justify-content:flex-start">${AV.map(a=>`<button class="sm ${profile&&profile.avatar===a?'on':'ghost'} avbtn" data-a="${a}"><img src="/assets/avatars/${a}.svg" alt=""></button>`).join('')}</div></div>
  <div><label>${t('name')}</label><div class="row" style="justify-content:flex-start"><input id="pn" maxlength="16" value="${esc(profile?.name??name)}" style="flex:1;text-align:left"><button class="sm" id="ps">${t('save')}</button></div></div>
  <div><label>${t('sound')}</label><div class="row" style="justify-content:flex-start">${b(cfg.sound,t('on'),'s_on')}${b(!cfg.sound,t('off'),'s_off')}</div></div>
  <div><label>${t('volume')}</label><input id="vol" type="range" min="0" max="100" value="${Math.round(cfg.vol*100)}"></div>
  <div><label>${t('lang')}</label><div class="row" style="justify-content:flex-start">${b(cfg.lang==='th','ไทย','l_th')}${b(cfg.lang==='lo','ລາວ','l_lo')}${b(cfg.lang==='en','English','l_en')}</div></div>
  <div><label>${t('sort')}</label><div class="row" style="justify-content:flex-start">${b(cfg.sort==='rank',t('sortrank'),'o_rank')}${b(cfg.sort==='suit',t('sortsuit'),'o_suit')}</div></div>
  <div><label>${t('shop')}</label><div style="display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto">${(()=>{const own=JSON.parse(profile?.owned||'["t-green"]');
    return ITEMS.map(i=>{const owned=own.includes(i.id),eq=i.kind==='theme'?profile?.theme===i.id:profile?.fx===i.id;
      const st=eq?`<span class="tag">${t('equipped')}</span>`:owned?`<button class="sm ghost" data-eq="${i.id}">${t('equip')}</button>`:`<button class="sm" data-buy="${i.id}" ${myLv<i.lv||(profile?.coins||0)<i.cost?'disabled':''}>${i.cost}🪙</button>`;
      return `<div class="srow"><span>${iname(i)}<br><small>Lv.${i.lv} · ${i.cost}🪙</small></span>${st}</div>`}).join('')})()}</div></div>
  <button id="x">${t('close')}</button></div>`;
  const set=(k,v)=>{cfg[k]=v;saveCfg();pushCfg();paintGear();paintModal();render()};
  $('#s_on').onclick=()=>{set('sound',true);try{ac();sfx('pass')}catch(e){}};$('#s_off').onclick=()=>set('sound',false);
  ['th','lo','en'].forEach(l=>$('#l_'+l).onclick=()=>set('lang',l));
  $('#o_rank').onclick=()=>set('sort','rank');$('#o_suit').onclick=()=>set('sort','suit');
  document.querySelectorAll('#avs [data-a],.box [data-a]').forEach(x=>x.onclick=()=>sock.emit('profile:save',{avatar:x.dataset.a}));
  $('#ps').onclick=()=>{const v=$('#pn').value.trim();if(v){name=v;sessionStorage.name=v;localStorage.name=v;sock.emit('profile:save',{name:v})}};
  document.querySelectorAll('#modal [data-buy]').forEach(b2=>b2.onclick=()=>sock.emit('shop:buy',{id:b2.dataset.buy}));
  document.querySelectorAll('#modal [data-eq]').forEach(b2=>b2.onclick=()=>sock.emit('shop:equip',{id:b2.dataset.eq}));
  $('#vol').oninput=e=>{cfg.vol=e.target.value/100;saveCfg();if(MG)MG.gain.value=cfg.vol};
  $('#vol').onchange=()=>{pushCfg();sfx('play')};
  $('#x').onclick=()=>modal.hidden=true;
}
gear.onclick=()=>{paintModal();modal.hidden=false};
modal.onclick=e=>{if(e.target===modal)modal.hidden=true};
paintGear();

/* ---- Socket ---- */
sock.on('room:state',s=>{const prev=S;S=s;sfxFor(prev,s);sel=new Set([...sel].filter(c=>s.hand.includes(c)));pendingSel=null;sessionStorage.room=s.code;render()});
sock.on('profile',p=>{profile=p;if(!p)return;applyLook();const nl=lvlOf(p.xp||0);if(lastLv!==null&&nl>lastLv)toast(`🎉 Level up! Lv.${nl} — ${titleFor(nl)}`);lastLv=nl;const nc={};for(const k of['lang','vol','sound','sort'])if(p[k]!==undefined&&p[k]!==null)nc[k]=k==='sound'?!!+p.sound:p[k];if(Object.keys(nc).length){Object.assign(cfg,nc);saveCfg();paintGear();if(!modal.hidden)paintModal();render()}});
function toast(txt){if(!txt)return;let d=$('#toast');if(!d){d=document.createElement('div');d.id='toast';document.body.appendChild(d)}d.textContent=txt;d.classList.add('show');clearTimeout(d._t);d._t=setTimeout(()=>d.classList.remove('show'),3500)}
sock.on('bonus',b=>toast((b.notes||[]).join('  ·  ')+(b.coins?`  ·  +${b.coins}🪙`:'')));
sock.on('daily',d=>{daily=d;if(!S)render()});
sock.on('error:msg',e=>{msg=E(e);if(pendingSel&&S&&S.phase==='playing'&&S.turn===S.me)sel=new Set(pendingSel.filter(c=>S.hand.includes(c)));pendingSel=null;if(!S)sessionStorage.removeItem('room');render()});
sock.on('connect',()=>{if(sessionStorage.room&&name)sock.emit('room:join',{code:sessionStorage.room,name,playerId:pid})});
setInterval(()=>{const el=$('#timer');if(el&&S&&S.phase==='playing')el.textContent=Math.max(0,Math.ceil((S.deadline-Date.now())/1000))+'s'},300);

const render=()=>{if(!S)return home();if(S.phase==='lobby')return lobby();table()};
const av=p=>p&&p.avatar&&/^[0-9A-Fa-f]{4,6}$/.test(p.avatar)?`<span class="avatar"><img src="/assets/avatars/${p.avatar}.svg" alt=""></span>`:`<span class="avatar">${esc(((p&&p.name)||'?')[0].toUpperCase())}</span>`;
const tag=p=>p.bot?' <span class="tag">Bot</span>':p.afk?` <span class="tag">${t('botplay')}</span>`:'';

function home(){
  const myLv=lvlOf(profile?.xp||0);
  app.innerHTML=`<div class="panel home"><div class="hrow"><div><h1>TENLEN</h1><p style="text-align:left;color:var(--dim);margin:0;font-size:13px">${t('sub')}</p></div><button id="sh" class="ghost sm"><img class="ic" src="/assets/icons/1F6D2.svg">${t('shop')}</button></div>
  ${profile?`<div class="chip" id="pf">${av(profile)}<div class="cinfo"><b>${esc(profile.name??name)}</b><small>Lv.${myLv} · ${titleFor(myLv)} · ${profile.coins??0}🪙</small></div></div>`:''}
  ${daily?`<div class="daily"><div class="drow"><b>${t('daily')}</b><span class="tag">🔥${profile?.login_streak??0} ${t('loginstreak')}</span></div>
  ${[{n:t('miss1'),cur:daily.played??0,need:3,done:daily.m1},{n:t('miss2'),cur:daily.won??0,need:1,done:daily.m2},{n:t('miss3'),cur:daily.won??0,need:2,done:daily.m3}].map(m=>`<div class="drow"><span>${m.n} <small>${Math.min(m.cur,m.need)}/${m.need}</small></span>${m.done?`<span class="tag">${t('claimed')}</span>`:`<div class="xpbar dmini"><div style="width:${Math.min(100,Math.round(m.cur/m.need*100))}%"></div></div>`}</div>`).join('')}</div>`:''}
  <input id="nm" placeholder="${t('name')}" maxlength="16" value="${esc(name)}">
  <div class="modes bot">${[1,2,3].map(n=>`<button class="mode" data-b="${n}"><img src="/assets/icons/1F3AE.svg"><b>${n} BOT</b><small>${t('quickplay')}</small></button>`).join('')}</div>
  <div class="modes fr"><button class="mode" id="cr"><img src="/assets/icons/1F3E0.svg"><b>${t('create')}</b><small>${t('friends')}</small></button><button class="mode" id="jn"><img src="/assets/icons/1F6AA.svg"><b>${t('join')}</b><small>CODE</small></button></div>
  <input id="cd" class="code" placeholder="000000" maxlength="6" inputmode="numeric">
  <div id="msg">${msg}</div></div>`;
  const nm=()=>{name=$('#nm').value.trim()||'Player';sessionStorage.name=name;localStorage.name=name;msg='';return name};
  const openSet=()=>{paintModal();modal.hidden=false};
  $('#sh').onclick=openSet;if($('#pf'))$('#pf').onclick=openSet;
  document.querySelectorAll('.mode[data-b]').forEach(b2=>b2.onclick=()=>{msg='';sock.emit('game:quick',{name:nm(),playerId:pid,bots:+b2.dataset.b})});
  $('#cr').onclick=()=>sock.emit('room:create',{name:nm(),playerId:pid});
  $('#jn').onclick=()=>sock.emit('room:join',{code:$('#cd').value,name:nm(),playerId:pid});
}
function lobby(){
  const host=S.hostId===pid,mine=S.players[S.me];
  const seats=S.players.map((p,i)=>`<div class="seat ${p.online?'':'off'}">${av(p)}${esc(p.name)}${p.lv?` <small class="tag">Lv${p.lv}</small>`:''}${p.host?` <small>(${t('host')})</small>`:''}${tag(p)}${host&&p.bot?`<button class="ghost rm" data-rm="${i}">${t('remove')}</button>`:''}<br><small>${p.ready?t('readyst'):t('waiting')}</small></div>`);
  while(seats.length<4)seats.push(`<div class="seat off"><small>${t('empty')}</small></div>`);
  app.innerHTML=`<div class="panel" style="max-width:520px"><h1>TENLEN</h1><div class="code-big">${S.code}</div>
  <p style="text-align:center;color:var(--dim);margin:0">${t('share')}</p><div class="seats">${seats.join('')}</div>
  <div class="row">${host?`<button id="st">${t('start')}</button>${S.players.length<4?`<button id="ab" class="ghost">${t('addbot')}</button>`:''}<button id="rb" class="ghost sm">${S.rules?.bao!==false?t('on'):t('off')} ${t('bao')}</button><button id="r2" class="ghost sm">${S.rules?.strict2?t('on'):t('off')} ${t('rstrict')}</button>`:`<button id="rd">${mine.ready?t('unready'):t('ready')}</button>`}<button id="lv" class="ghost">${t('leave')}</button></div><div id="msg">${msg}</div></div>`;
  if(host){$('#st').onclick=()=>sock.emit('game:start');if($('#ab'))$('#ab').onclick=()=>sock.emit('room:addBot');
    if($('#rb'))$('#rb').onclick=()=>sock.emit('room:rules',{bao:!(S.rules?.bao!==false),strict2:!!S.rules?.strict2});
    if($('#r2'))$('#r2').onclick=()=>sock.emit('room:rules',{bao:S.rules?.bao!==false,strict2:!S.rules?.strict2});
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>sock.emit('room:removeBot',{seat:+b.dataset.rm}))}
  else $('#rd').onclick=()=>sock.emit('room:ready');
  $('#lv').onclick=()=>{sock.emit('room:leave');S=null;sessionStorage.removeItem('room');render()};
}
function seatEl(i,cls){
  const p=S.players[i];
  return `<div class="seat ${cls} ${S.turn===i&&S.phase==='playing'?'turn':''} ${S.phase==='finished'&&S.winner===i?'win':''} ${p.online?'':'off'} ${S.passed.includes(i)?'off':''}">${av(p)}${esc(p.name)}${p.lv?` <small class="tag">Lv${p.lv}</small>`:''}${p.bao?' <span class="tag">BÁO!</span>':''}${tag(p)}<br><small>${p.count} ${t('cards')}${S.passed.includes(i)?' / '+t('passed'):''}${S.vanWins?.[i]?` · ${S.vanWins[i]}${t('van')}`:''}</small>${S.phase==='finished'&&S.reveal?`<div class="backs faces">${S.reveal[i].map((c,k)=>cardEl(c,'',`--i:${k}`)).join('')}</div>`:`<div class="backs">${Array.from({length:p.count},(_,k)=>`<div class="back" style="--i:${k}"></div>`).join('')}</div>`}</div>`;
}
function rankingHtml(){
  const match=S.matchWinner!=null;
  const order=match?S.players.map((_,i)=>i).sort((a,b)=>(S.vanWins?.[b]??0)-(S.vanWins?.[a]??0)||a-b)
    :S.players.map((_,i)=>i).sort((a,b)=>a===S.winner?-1:b===S.winner?1:(S.reveal[a].length-S.reveal[b].length)||a-b);
  return `<div id="rank">`+order.map((i,k)=>{const p=S.players[i],rem=S.reveal[i];
    const detail=match?`${S.vanWins?.[i]??0} ${t('van')}`:(k===0?t('wins'):rem.length+' '+t('cards')+' '+t('left'));
    return `<div class="rrow ${i===S.me?'me':''}"><b>${t('rank')} ${k+1}</b> &nbsp;${esc(p.name)}${tag(p)} &mdash; ${detail}</div>`}).join('')+`</div>`;
}
function comboTxt(){
  const l=S.last;if(!l)return'';
  const base=t('c_'+l.type)+(l.type==='pairseq'?' ×'+(l.cards.length/2):'');
  return base+(l.cards.some(c=>(c>>2)===12)?' '+t('c_two'):'');
}
function table(){
  const anim=dealFresh;dealFresh=false;
  let fx=fxPlay&&Date.now()<fxPlay.until?fxPlay:null;if(fxPlay&&!fx)fxPlay=null;
  const n=S.players.length,m=S.me,at=o=>(m+o)%n,fin=S.phase==='finished',myTurn=S.turn===m&&!fin,me=S.players[m];
  const pos=n===2?{top:1}:n===3?{left:1,right:2}:{left:1,top:2,right:3};
  const sx=k=>pos[k]?seatEl(at(pos[k]),k):'';
  const hand=cfg.sort==='suit'?[...S.hand].sort((a,b)=>(a%4-b%4)||(a-b)):S.hand;
  const must=S.firstMove&&myTurn?S.firstCard:null;
  const match=S.matchWinner!=null;
  const mid=fin?`${S.toiTrang?`<div class="code-big" style="font-size:20px;color:#7fd4ff">${t('toitrang')}</div>`:''}<div class="code-big" style="font-size:24px;letter-spacing:.06em">${match?`<img class="trophy" src="/assets/icons/1F3C6.svg" alt="">${esc(S.players[S.matchWinner].name)} ${t('wins')}!`:(S.winner===m?t('youwin'):esc(S.players[S.winner].name)+' '+t('wins'))}</div>${rankingHtml()}`
    :S.last?`<small>${esc(S.players[S.last.by].name)}</small><div class="cards ${fx?'fx-'+fx.kind:''}">${S.last.cards.map(c=>cardEl(c)).join('')}</div><small class="cb">${comboTxt()}</small>`
    :`<small>${myTurn?(must!==null?E('must_include_first_card'):t('lead')):t('wait')}</small>`;
  app.innerHTML=`<div id="table" class="${anim?'dealing-opp':''} ${fx&&(fx.kind==='bomb'||fx.kind==='mega')?'shake':''}">${sx('top')}${sx('left')}<div id="center"><small>ROOM ${S.code}${S.van?` · ${t('van')} ${S.van}/3`:''} <span id="timer"></span></small>${mid}${anim?'<div class="back deck"></div>':''}</div>${sx('right')}</div>
  ${fx&&!fx.shown?`<div id="fxf" class="go ${fx.kind}"></div>`:''}
  <div id="msg">${msg}</div>
  <div id="bar">${fin?(S.hostId===pid?(match?`<button id="ag">${t('again')}</button>`:`<button id="nx">${t('nextvan')}</button>`):`<small>${match?t('waithost'):t('waitvan')}</small>`)
    :`${myTurn&&me.hand.length===1&&S.rules?.bao!==false&&!me.bao?`<button id="bo" class="ghost">${t('bao')}</button>`:''}${me.afk?`<button id="rs">${t('resume')}</button>`:''}<button id="pa" class="ghost" ${myTurn&&S.last?'':'disabled'}>${t('pass')}</button><button id="pl" ${myTurn&&sel.size?'':'disabled'}>${t('play')}</button><button id="so" class="ghost sm">${t('sort')}: ${cfg.sort==='suit'?t('sortsuit'):t('sortrank')}</button>`}</div>
  <div id="hand" class="cards ${anim?'dealing':''}" style="padding:18px 0 6px">${hand.map((c,i)=>cardEl(c,(sel.has(c)?'sel ':'')+(must!==null&&c===must?'must':''),anim?`--i:${i}`:'')).join('')}</div>`;
  if(fx)fx.shown=true;
  document.querySelectorAll('#hand .card').forEach(e=>e.onclick=()=>{if(Date.now()<dealUntil)return;const c=+e.dataset.c;sel.has(c)?sel.delete(c):sel.add(c);sel=new Set(smartSel(S.hand,[...sel]));msg='';table()});
  if($('#pl'))$('#pl').onclick=()=>{pendingSel=[...sel];sel.clear();sock.emit('game:play',{cards:[...pendingSel]})};
  if($('#pa'))$('#pa').onclick=()=>sock.emit('game:pass');
  if($('#ag'))$('#ag').onclick=()=>sock.emit('game:again');
  if($('#nx'))$('#nx').onclick=()=>sock.emit('game:next');
  if($('#bo'))$('#bo').onclick=()=>sock.emit('game:bao');
  if($('#rs'))$('#rs').onclick=()=>sock.emit('game:resume');
  if($('#so'))$('#so').onclick=()=>{cfg.sort=cfg.sort==='suit'?'rank':'suit';saveCfg();pushCfg();table()};
  msg='';
}
const fit=()=>{const w=Math.min(innerWidth,document.documentElement.clientWidth,980);document.documentElement.style.setProperty('--cw',Math.max(30,Math.min(58,(w-40)/9.8)).toFixed(1)+'px')};
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,100));fit();
render();
</script></body></html>
